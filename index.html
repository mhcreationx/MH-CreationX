<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MH Creation X – Daily Project MASTER</title>
  <meta name="description" content="Premium project management and financial tracking system for professional graphic designers. Features secure client portals, A4 cash memo printing, and team access control. Engineered by Moazzem Hossen." />
  <meta property="og:title" content="MH Creation X – Daily Project MASTER" />
  <meta property="og:description" content="Premium project management and financial tracking system for professional graphic designers. Features secure client portals, A4 cash memo printing, and team access control. Engineered by Moazzem Hossen." />
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <!-- Tailwind CSS will be loaded via index.css -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-color: #f8fafc;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --glass-bg: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(255, 255, 255, 0.65);
      --glass-shadow: 0 20px 50px -12px rgba(99, 102, 241, 0.08), 0 8px 24px -4px rgba(15, 23, 42, 0.05);
      --glass-inner-highlight: inset 0 1px 1px 0 rgba(255, 255, 255, 0.9);
      --accent-gradient: linear-gradient(135deg, #2563eb 0%, #4f46e5 50%, #7c3aed 100%);
    }

    .dark {
      --bg-color: #030712;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --glass-bg: rgba(15, 23, 42, 0.68);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-shadow: 0 25px 60px -15px rgba(2, 6, 23, 0.7), 0 0 35px -5px rgba(99, 102, 241, 0.12);
      --glass-inner-highlight: inset 0 1px 1px 0 rgba(255, 255, 255, 0.15);
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #6366f1 50%, #8b5cf6 100%);
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.14) 0px, transparent 45%),
        radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.12) 0px, transparent 45%),
        radial-gradient(at 50% 50%, rgba(6, 182, 212, 0.06) 0px, transparent 50%),
        radial-gradient(at 80% 90%, rgba(217, 70, 239, 0.05) 0px, transparent 40%);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-x: clip;
    }

    .dark body {
      background-image: 
        radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.2) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(124, 58, 237, 0.18) 0px, transparent 50%),
        radial-gradient(at 50% 60%, rgba(14, 165, 233, 0.1) 0px, transparent 50%),
        radial-gradient(at 85% 95%, rgba(168, 85, 247, 0.12) 0px, transparent 45%);
      background-attachment: fixed;
    }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), var(--glass-inner-highlight);
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 2.5rem;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), var(--glass-inner-highlight);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 30px 80px -15px rgba(79, 70, 229, 0.2), 0 0 25px rgba(99, 102, 241, 0.15), var(--glass-inner-highlight);
      border-color: rgba(99, 102, 241, 0.45);
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.2);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.4);
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }

      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      html,
      body {
        height: auto !important;
        background: white !important;
        color: black !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
      }

      .no-print,
      .no-print * {
        display: none !important;
      }

      #root,
      #root>div,
      main,
      main>div {
        display: block !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: auto !important;
        position: static !important;
        background: none !important;
        backdrop-filter: none !important;
      }

      .cash-memo-container,
      .print-container {
        display: block !important;
        width: 210mm !important;
        min-height: 297mm !important;
        margin: 0 auto !important;
        padding: 15mm !important;
        background: white !important;
        color: black !important;
        border: none !important;
        box-shadow: none !important;
        box-sizing: border-box !important;
        position: static !important;
        overflow: visible !important;
      }

      h1,
      h2,
      h3,
      h4,
      p,
      span,
      td,
      th {
        color: black !important;
      }
    }
  </style>

  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
