<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="40%" stop-color="#0b0f2a"/>
      <stop offset="80%" stop-color="#120d2d"/>
      <stop offset="100%" stop-color="#030511"/>
    </linearGradient>

    <radialGradient id="glow-indigo" cx="20%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-violet" cx="80%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1920" height="1080" fill="url(#bg-grad)"/>

  <!-- Glowing Orbs -->
  <circle cx="380" cy="270" r="450" fill="url(#glow-indigo)"/>
  <circle cx="1540" cy="810" r="500" fill="url(#glow-violet)"/>
  <circle cx="960" cy="540" r="380" fill="url(#glow-cyan)"/>

  <!-- Decorative Studio Tech Grid Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="1080"/>
    <line x1="320" y1="0" x2="320" y2="1080"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="640" y1="0" x2="640" y2="1080"/>
    <line x1="800" y1="0" x2="800" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1120" y1="0" x2="1120" y2="1080"/>
    <line x1="1280" y1="0" x2="1280" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
    <line x1="1760" y1="0" x2="1760" y2="1080"/>
    <line x1="0" y1="120" x2="1920" y2="120"/>
    <line x1="0" y1="240" x2="1920" y2="240"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="480" x2="1920" y2="480"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="840" x2="1920" y2="840"/>
    <line x1="0" y1="960" x2="1920" y2="960"/>
  </g>

  <!-- Border Inner Frame -->
  <rect x="80" y="70" width="1760" height="940" rx="36" fill="none" stroke="url(#card-border)" stroke-width="2" opacity="0.45"/>
  <rect x="96" y="86" width="1728" height="908" rx="28" fill="#080c1f" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Corner Accents -->
  <path d="M 120 180 L 120 120 L 180 120" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
  <path d="M 1800 180 L 1800 120 L 1740 120" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
  <path d="M 120 900 L 120 960 L 180 960" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
  <path d="M 1800 900 L 1800 960 L 1740 960" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>

  <!-- Studio Tag Badge -->
  <g transform="translate(960, 210)">
    <rect x="-170" y="-24" width="340" height="48" rx="24" fill="#6366f1" fill-opacity="0.22" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="-135" cy="0" r="5" fill="#38bdf8"/>
    <text x="5" y="7" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="800" fill="#a5b4fc" letter-spacing="4">OFFICIAL ANNOUNCEMENT</text>
  </g>

  <!-- Main Headline Title -->
  <g transform="translate(960, 390)">
    <text x="0" y="0" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="78" font-weight="900" fill="url(#gold-text)" letter-spacing="-1">
      MH CREATION X
    </text>
    <text x="0" y="65" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="28" font-weight="700" fill="#818cf8" letter-spacing="8">
      PREMIUM GRAPHIC DESIGN &amp; CINEMA LAB
    </text>
  </g>

  <!-- Decorative Separator Line -->
  <g transform="translate(960, 520)">
    <line x1="-360" y1="0" x2="360" y2="0" stroke="url(#card-border)" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#6366f1" filter="url(#neon-glow)"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>

  <!-- Notice Body Content -->
  <g transform="translate(960, 640)">
    <text x="0" y="0" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="0">
      SPECIAL STUDIO NOTICE &amp; SERVICE UPDATE
    </text>
    <text x="0" y="60" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="500" fill="#94a3b8" letter-spacing="1">
      We are accepting exclusive project bookings for Cinema, Natok, Music Video &amp; Digital Banners.
    </text>
    <text x="0" y="105" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="19" font-weight="600" fill="#c7d2fe" letter-spacing="2">
      Direct Client Portal &amp; Cash Memo printing available 24/7 for verified clients.
    </text>
  </g>

  <!-- Bottom Badges / Stats -->
  <g transform="translate(960, 890)">
    <!-- Badge 1 -->
    <g transform="translate(-400, 0)">
      <rect x="-120" y="-30" width="240" height="60" rx="16" fill="#1e1b4b" fill-opacity="0.6" stroke="#4338ca" stroke-width="1.2"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#e0e7ff" letter-spacing="1">CINEMA QUALITY</text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(0, 0)">
      <rect x="-120" y="-30" width="240" height="60" rx="16" fill="#1e1b4b" fill-opacity="0.6" stroke="#4338ca" stroke-width="1.2"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#e0e7ff" letter-spacing="1">FAST DELIVERY</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(400, 0)">
      <rect x="-120" y="-30" width="240" height="60" rx="16" fill="#1e1b4b" fill-opacity="0.6" stroke="#4338ca" stroke-width="1.2"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#e0e7ff" letter-spacing="1">VERIFIED PORTAL</text>
    </g>
  </g>
</svg>
